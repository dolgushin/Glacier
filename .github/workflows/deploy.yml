name: Deploy Glacier to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy and rebuild
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          SSH_OPTS="-p ${PORT:-22} -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy"
          # Push the repository first, keeping server-only state (.env, data/) intact.
          ssh $SSH_OPTS "$USER@$HOST" 'mkdir -p /opt/glacier/data'
          tar czf - --exclude .git --exclude data --exclude .env . | \
            ssh $SSH_OPTS "$USER@$HOST" 'tar xzf - -C /opt/glacier'

          # First run: bootstrap .env from the example (it only exists after the push).
          # An existing .env (with GLACIER_SECRET) is never touched.
          ssh $SSH_OPTS "$USER@$HOST" '\
            [ -f /opt/glacier/.env ] || cp /opt/glacier/.env.example /opt/glacier/.env'

          ssh $SSH_OPTS "$USER@$HOST" '\
            cd /opt/glacier && \
            docker compose up --build --force-recreate -d && \
            docker image prune -f >/dev/null || true'