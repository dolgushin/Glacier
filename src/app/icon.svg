<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="32" height="32">
  <!--
    The Glacier mark: three strata cut by a peak. Accent blue with strata knocked
    out in white, so it stays legible on both light and dark browser chrome.
  -->
  <rect width="20" height="20" fill="none"/>
  <path d="M0 20 L10 3 L20 20 Z" fill="#00aff5"/>
  <path d="M4.4 12.8 L15.6 12.8" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M6.9 8.5 L13.1 8.5" stroke="#ffffff" stroke-width="1.5"/>
</svg>
